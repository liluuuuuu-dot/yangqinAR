<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      touch-action: none;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.47);
      z-index: 9999;
    }

    #startButton {
      padding: 16px 32px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #infoPanel {
      display: none;
      position: fixed;
      left: 20px;
      bottom: 25px;
      max-width: 300px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      border-radius: 10px;
      z-index: 5000;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    .objectTitle {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .objectInfo {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <button id="startButton">开始体验</button>
  </div>

  <audio id="bgMusic" src="./background_music.mp3" preload="auto" loop></audio>
  <audio id="narration" src="./narration_voice.mp3" preload="auto"></audio>

  <div id="infoPanel">
    <div class="objectTitle">扬琴</div>
    <div class="objectInfo">
    乐器名称：扬琴<br>
    代表曲目：《旱天雷》<br>
    音乐溯源：严老烈（1850-？），广东音乐先驱
    </div>
  </div>

  <a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target"
      mindar-image-target="targetIndex: 0; smooth: true; smoothCount: 5; smoothTolerance: 0.01; smoothThreshold: 2">

      <a-entity id="modelRoot" position="0 0 0" scale="0.3 0.3 0.3">

        <a-entity id="spinRoot" animation="
            property: rotation;
            from: 0 0 0;
            to: 0 360 0;
            loop: true;
            dur: 10000;
            easing: linear">

          <a-gltf-model src="./yangqin.glb" position="0 0 0" rotation="0 0 0">
          </a-gltf-model>

        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.querySelector("#startScreen");
    const startButton = document.querySelector("#startButton");
    const target = document.querySelector("#target");
    const bgMusic = document.querySelector("#bgMusic");
    const narration = document.querySelector("#narration");
    const infoPanel = document.querySelector("#infoPanel");

    bgMusic.volume = 0.8;
    narration.volume = 1.0;

    let experienceStarted = false;
    let targetVisible = false;
    let narrationFinished = false;

    startButton.addEventListener("click", async () => {
      try {
        bgMusic.muted = true;
        await bgMusic.play();
        bgMusic.pause();
        bgMusic.currentTime = 0;
        bgMusic.muted = false;

        narration.muted = true;
        await narration.play();
        narration.pause();
        narration.currentTime = 0;
        narration.muted = false;
      } catch (error) {
        console.log("Audio unlock:", error);
      }

      experienceStarted = true;
      startScreen.style.display = "none";

      if (targetVisible) {
        playAudio();
        infoPanel.style.display = "block";
      }
    });

    function playAudio() {
      if (!experienceStarted) return;

      bgMusic.play().catch((error) => {
        console.log("Background music error:", error);
      });

      if (!narrationFinished) {
        narration.play().catch((error) => {
          console.log("Narration error:", error);
        });
      }
    }

    target.addEventListener("targetFound", () => {
      console.log("🎯 TARGET FOUND");
      targetVisible = true;
      playAudio();

      if (experienceStarted) {
        infoPanel.style.display = "block";
      }
    });

    target.addEventListener("targetLost", () => {
      console.log("TARGET LOST");
      targetVisible = false;
      bgMusic.pause();
      narration.pause();
      infoPanel.style.display = "none";
    });

    narration.addEventListener("ended", () => {
      narrationFinished = true;
      console.log("🔊 Narration Finished");
    });
  </script>

</body>

</html>
